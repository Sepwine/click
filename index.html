<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,
    initial-scale=1.0,
    maximum-scale=1.0,
    user-scalable=no"
  >

  <title>Click.</title>

  <meta name="apple-mobile-web-app-capable" content="yes">

  <style>

    :root {
      --bg-light: #fafafa;
      --text-main: #262626;
      --border-color: #dbdbdb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;

      min-height: 100vh;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      background: var(--bg-light);
      color: var(--text-main);

      user-select: none;
    }

    header {
      height: 68px;

      display: flex;
      align-items: center;

      justify-content: space-between;

      padding: 0 18px;

      background: #fff;

      border-bottom:
        1px solid
        var(--border-color);
    }

    .header-left {
      display: flex;
      align-items: center;

      gap: 8px;
    }

    .logo {
      font-size: 1.2rem;
      font-weight: 600;

      letter-spacing: 1px;

      margin-right: 5px;
    }

    .header-btn {
      width: 36px;
      height: 36px;

      border-radius: 50%;

      border:
        1px solid
        var(--border-color);

      background: #fff;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 16px;

      cursor: pointer;

      -webkit-tap-highlight-color: transparent;
    }

    .header-btn:active {
      transform: scale(.94);
      background: #f0f0f0;
    }

    .profile-trigger {
      width: 36px;
      height: 36px;

      border-radius: 50%;

      overflow: hidden;

      cursor: pointer;

      border:
        1px solid
        var(--border-color);
    }

    .profile-trigger img {
      width: 100%;
      height: 100%;

      object-fit: cover;
    }

    main {
      min-height:
        calc(100vh - 68px);

      display: flex;

      justify-content: center;

      align-items: flex-start;

      padding:
        30px 20px;
    }

    .button-container {

      display: grid;

      grid-template-columns:
        repeat(2, 1fr);

      gap: 15px;

      width: 100%;

      max-width: 350px;
    }

    .action-btn {

      background: #fff;

      border:
        1px solid
        var(--border-color);

      border-radius: 12px;

      padding:
        25px 15px;

      display: flex;

      flex-direction: column;

      align-items: center;

      gap: 12px;

      cursor: pointer;

      color: var(--text-main);

      transition:
        all .2s ease;

      position: relative;
    }

    .action-btn:active {

      background: #f0f0f0;

      transform: scale(.97);
    }

    .btn-icon {
      font-size: 2rem;
    }

    .btn-label {
      font-size: .9rem;

      font-weight: 500;
    }

    .add-btn {

      background: transparent;

      border:
        2px dashed
        var(--border-color);

      color: #999;
    }

    /* =========================
       模态框
    ========================= */

    .modal-overlay {

      position: fixed;

      inset: 0;

      background:
        rgba(0,0,0,.4);

      backdrop-filter:
        blur(8px);

      display: flex;

      justify-content: center;

      align-items: flex-end;

      opacity: 0;

      pointer-events: none;

      transition:
        opacity .25s ease;

      z-index: 100;
    }

    .modal-overlay.active {

      opacity: 1;

      pointer-events: auto;
    }

    .modal-content {

      background: #fff;

      width: 100%;

      max-width: 450px;

      border-radius:
        20px 20px 0 0;

      padding:
        30px 20px;

      transform:
        translateY(100%);

      transition:
        transform .3s ease;

      max-height: 90vh;

      overflow-y: auto;
    }

    .modal-overlay.active
    .modal-content {

      transform:
        translateY(0);
    }

    /* =========================
       个人中心
    ========================= */

    .connection-avatars {

      display: flex;

      justify-content: center;

      align-items: center;

      gap: 20px;

      margin-bottom: 30px;
    }

    .avatar-wrapper {

      width: 70px;
      height: 70px;

      border-radius: 50%;

      padding: 3px;

      background:
        linear-gradient(
          45deg,
          #d3cce3,
          #e9e4f0
        );

      cursor: pointer;

      position: relative;
    }

    .avatar-wrapper img {

      width: 100%;
      height: 100%;

      border-radius: 50%;

      object-fit: cover;

      border:
        2px solid #fff;
    }

    .avatar-wrapper.locked {

      cursor: default;

      opacity: .9;
    }

    .avatar-wrapper::after {

      content: '+';

      position: absolute;

      bottom: -5px;
      right: -5px;

      background:
        var(--text-main);

      color: #fff;

      width: 22px;
      height: 22px;

      border-radius: 50%;

      display: flex;

      justify-content: center;

      align-items: center;

      font-size: 12px;

      font-weight: bold;

      border:
        2px solid #fff;
    }

    .avatar-wrapper.locked::after {

      content: '●';

      font-size: 8px;

      background: #aaa;
    }

    .mobius {

      font-size: 2rem;

      color: #999;

      font-weight: 300;
    }

    .role-text {

      text-align: center;

      color: #777;

      font-size: .85rem;

      margin-top: -20px;

      margin-bottom: 20px;
    }

    .connection-status {

      text-align: center;

      margin-bottom: 20px;

      font-size: .85rem;

      color: #777;
    }

    .primary-btn {

      width: 100%;

      background:
        var(--text-main);

      color: #fff;

      border: none;

      padding:
        14px 24px;

      border-radius: 8px;

      font-size: 1rem;

      font-weight: 600;

      cursor: pointer;

      margin-top: 8px;
    }

    .danger-btn {

      background: #e5e5e5;

      color: #333;
    }

    /* =========================
       输入框
    ========================= */

    .input-group {

      margin-bottom: 15px;
    }

    .input-group label {

      display: block;

      font-size: .85rem;

      color: #666;

      margin-bottom: 5px;
    }

    .input-group input {

      width: 100%;

      padding: 12px;

      border:
        1px solid
        var(--border-color);

      border-radius: 8px;

      font-size: 1rem;
    }

    /* =========================
       Toast
    ========================= */

    #toast {

      position: fixed;

      left: 50%;

      bottom: 30px;

      transform:
        translate(-50%, 20px);

      background:
        rgba(40,40,40,.92);

      color: #fff;

      padding:
        12px 18px;

      border-radius: 10px;

      font-size: .9rem;

      opacity: 0;

      pointer-events: none;

      transition:
        all .25s ease;

      z-index: 1000;

      max-width: 85%;

      text-align: center;
    }

    #toast.show {

      opacity: 1;

      transform:
        translate(-50%, 0);
    }

    /* =========================
       消息弹窗
    ========================= */

    #messagePopup {

      position: fixed;

      top: 85px;

      left: 50%;

      transform:
        translateX(-50%)
        translateY(-20px);

      width: calc(100% - 40px);

      max-width: 380px;

      background: #fff;

      border:
        1px solid
        var(--border-color);

      border-radius: 14px;

      padding: 15px;

      box-shadow:
        0 8px 30px
        rgba(0,0,0,.15);

      opacity: 0;

      pointer-events: none;

      transition:
        all .3s ease;

      z-index: 900;
    }

    #messagePopup.show {

      opacity: 1;

      transform:
        translateX(-50%)
        translateY(0);
    }

    .popup-title {

      font-size: .8rem;

      color: #888;

      margin-bottom: 5px;
    }

    .popup-message {

      font-size: 1rem;

      color: #222;

      line-height: 1.5;
    }

    /* =========================
       房间信息
    ========================= */

    .room-info {

      text-align: center;

      font-size: .75rem;

      color: #999;

      margin-top: 15px;

      word-break: break-all;
    }

  </style>
</head>

<body>

<header>

  <div class="header-left">

    <div class="logo">
      Click.
    </div>

    <!-- 测试消息 -->
    <button
      class="header-btn"
      id="testMessageBtn"
      title="发送测试信息"
    >
      ♢
    </button>

    <!-- 美化设置入口 -->
    <button
      class="header-btn"
      id="styleBtn"
      title="页面美化"
    >
      Aa
    </button>

  </div>

  <div
    class="profile-trigger"
    id="openProfileBtn"
  >

    <img
      id="headerAvatar"
      src=""
      alt=""
    >

  </div>

</header>


<main>

  <div
    class="button-container"
    id="buttonContainer"
  ></div>

</main>


<!-- =========================
     个人中心
========================= -->

<div
  class="modal-overlay"
  id="profileModal"
>

  <div class="modal-content">

    <div class="connection-avatars">

      <!-- Owner -->
      <div
        class="avatar-wrapper"
        id="ownerAvatarWrapper"
      >

        <img
          id="ownerAvatar"
          src=""
          alt=""
        >

      </div>


      <div class="mobius">
        ∞
      </div>


      <!-- Guest -->
      <div
        class="avatar-wrapper"
        id="guestAvatarWrapper"
      >

        <img
          id="guestAvatar"
          src=""
          alt=""
        >

      </div>

    </div>


    <div
      class="role-text"
      id="roleText"
    >
      当前身份
    </div>


    <div
      class="connection-status"
      id="connectionStatus"
    >
      未连接
    </div>


    <button
      class="primary-btn"
      id="shareBtn"
    >
      🔗 获取专属连接
    </button>


    <button
      class="primary-btn danger-btn"
      id="leaveBtn"
      style="display:none;"
    >
      断开链接
    </button>


    <div
      class="room-info"
      id="roomInfo"
    ></div>

  </div>

</div>


<!-- =========================
     新建状态
========================= -->

<div
  class="modal-overlay"
  id="addBtnModal"
>

  <div class="modal-content">

    <h3>
      新建状态按钮
    </h3>


    <div class="input-group">

      <label>
        Emoji 图标
      </label>

      <input
        type="text"
        id="newIcon"
        placeholder="例如：🎮"
        maxlength="2"
      >

    </div>


    <div class="input-group">

      <label>
        按钮名称
      </label>

      <input
        type="text"
        id="newLabel"
        placeholder="例如：打游戏"
        maxlength="6"
      >

    </div>


    <div class="input-group">

      <label>
        推送给对方的消息
      </label>

      <input
        type="text"
        id="newMsg"
        placeholder="例如：对方正在打游戏"
      >

    </div>


    <button
      class="primary-btn"
      id="saveNewBtn"
    >
      保存
    </button>

  </div>

</div>


<!-- =========================
     消息提示
========================= -->

<div id="messagePopup">

  <div
    class="popup-title"
    id="popupTitle"
  >
    对方
  </div>

  <div
    class="popup-message"
    id="popupMessage"
  ></div>

</div>


<div id="toast"></div>


<script type="module">

/*
==================================================
 Firebase 配置
==================================================

把下面这些内容替换成你自己的 Firebase Web App 配置。

Firebase Console
→ Project settings
→ Your apps
→ Web app
→ SDK setup and configuration

==================================================
*/

import {
  initializeApp
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  signInAnonymously,
  onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  getDatabase,
  ref,
  get,
  set,
  update,
  remove,
  onValue,
  onDisconnect,
  push
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


/* =================================================
   在这里填写 Firebase 配置
================================================= */

const firebaseConfig = {

  apiKey:
    "YOUR_API_KEY",

  authDomain:
    "YOUR_PROJECT.firebaseapp.com",

  databaseURL:
    "https://YOUR_PROJECT-default-rtdb.firebaseio.com",

  projectId:
    "YOUR_PROJECT_ID",

  storageBucket:
    "YOUR_PROJECT.firebasestorage.app",

  messagingSenderId:
    "YOUR_MESSAGING_SENDER_ID",

  appId:
    "YOUR_APP_ID"

};


/* =================================================
   Firebase 初始化
================================================= */

const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const db =
  getDatabase(app);


/* =================================================
   基础变量
================================================= */

let currentUser = null;

let roomId = null;

let role = null;

let roomListener = null;

let messageListener = null;

let messagePopupTimer = null;


/* =================================================
   默认头像
================================================= */

const defaultAvatar =
  "data:image/svg+xml;utf8," +
  "<svg xmlns='http://www.w3.org/2000/svg' " +
  "viewBox='0 0 100 100'>" +
  "<rect fill='%23eeeeee' width='100' height='100'/>" +
  "<circle cx='50' cy='38' r='18' fill='%23bbbbbb'/>" +
  "<path d='M20 90 C20 65 80 65 80 90' fill='%23bbbbbb'/>" +
  "</svg>";


/* =================================================
   默认状态按钮
================================================= */

const defaultButtons = [

  {
    id: "eat",
    icon: "🍴",
    label: "吃饭",
    msg: "对方准备去吃饭了"
  },

  {
    id: "sleep",
    icon: "🌙",
    label: "睡觉",
    msg: "对方困了，准备休息"
  }

];


let savedButtons =
  JSON.parse(
    localStorage.getItem(
      "click_custom_buttons"
    )
  ) || defaultButtons;


/* =================================================
   DOM
================================================= */

const container =
  document.getElementById(
    "buttonContainer"
  );

const profileModal =
  document.getElementById(
    "profileModal"
  );

const addBtnModal =
  document.getElementById(
    "addBtnModal"
  );

const ownerAvatar =
  document.getElementById(
    "ownerAvatar"
  );

const guestAvatar =
  document.getElementById(
    "guestAvatar"
  );

const headerAvatar =
  document.getElementById(
    "headerAvatar"
  );

const roleText =
  document.getElementById(
    "roleText"
  );

const connectionStatus =
  document.getElementById(
    "connectionStatus"
  );

const roomInfo =
  document.getElementById(
    "roomInfo"
  );

const shareBtn =
  document.getElementById(
    "shareBtn"
  );

const leaveBtn =
  document.getElementById(
    "leaveBtn"
  );

const toast =
  document.getElementById(
    "toast"
  );

const messagePopup =
  document.getElementById(
    "messagePopup"
  );

const popupTitle =
  document.getElementById(
    "popupTitle"
  );

const popupMessage =
  document.getElementById(
    "popupMessage"
  );


/* =================================================
   Toast
================================================= */

function showToast(text) {

  toast.textContent = text;

  toast.classList.add("show");

  setTimeout(() => {

    toast.classList.remove("show");

  }, 2500);

}


/* =================================================
   对方消息弹窗
================================================= */

function showMessage(
  title,
  message
) {

  popupTitle.textContent =
    title;

  popupMessage.textContent =
    message;

  messagePopup.classList.add(
    "show"
  );

  clearTimeout(
    messagePopupTimer
  );

  messagePopupTimer =
    setTimeout(() => {

      messagePopup.classList.remove(
        "show"
      );

    }, 3500);

}


/* =================================================
   本地按钮
================================================= */

function renderButtons() {

  container.innerHTML = "";


  savedButtons.forEach(
    (btn, index) => {

      const btnEl =
        document.createElement(
          "div"
        );

      btnEl.className =
        "action-btn";


      btnEl.innerHTML = `

        <span class="btn-icon">
          ${btn.icon}
        </span>

        <span class="btn-label">
          ${btn.label}
        </span>

      `;


      let pressTimer;


      btnEl.addEventListener(
        "touchstart",
        () => {

          pressTimer =
            setTimeout(() => {

              const ok =
                confirm(
                  `确定删除「${btn.label}」吗？`
                );

              if (!ok) return;


              savedButtons.splice(
                index,
                1
              );


              localStorage.setItem(
                "click_custom_buttons",
                JSON.stringify(
                  savedButtons
                )
              );


              renderButtons();

            }, 800);

        }
      );


      btnEl.addEventListener(
        "touchend",
        () => {

          clearTimeout(
            pressTimer
          );

        }
      );


      btnEl.addEventListener(
        "click",
        async () => {

          await sendMessage(
            btn.label,
            btn.msg
          );

        }
      );


      container.appendChild(
        btnEl
      );

    }
  );


  const addBtn =
    document.createElement(
      "div"
    );

  addBtn.className =
    "action-btn add-btn";


  addBtn.innerHTML = `

    <span class="btn-icon">
      ＋
    </span>

    <span class="btn-label">
      添加状态
    </span>

  `;


  addBtn.onclick = () => {

    addBtnModal.classList.add(
      "active"
    );

  };


  container.appendChild(
    addBtn
  );

}


renderButtons();


/* =================================================
   创建新按钮
================================================= */

document
  .getElementById("saveNewBtn")
  .onclick = () => {

    const icon =
      document.getElementById(
        "newIcon"
      ).value || "✨";


    const label =
      document.getElementById(
        "newLabel"
      ).value || "新状态";


    const msg =
      document.getElementById(
        "newMsg"
      ).value ||
      "对方发送了一个新状态";


    savedButtons.push({

      id:
        Date.now().toString(),

      icon,

      label,

      msg

    });


    localStorage.setItem(
      "click_custom_buttons",
      JSON.stringify(
        savedButtons
      )
    );


    renderButtons();


    document.getElementById(
      "newIcon"
    ).value = "";

    document.getElementById(
      "newLabel"
    ).value = "";

    document.getElementById(
      "newMsg"
    ).value = "";


    addBtnModal.classList.remove(
      "active"
    );

  };


/* =================================================
   模态框关闭
================================================= */

document
  .querySelectorAll(
    ".modal-overlay"
  )
  .forEach(modal => {

    modal.addEventListener(
      "click",
      e => {

        if (
          e.target === modal
        ) {

          modal.classList.remove(
            "active"
          );

        }

      }
    );

  });


/* =================================================
   登录 Firebase 匿名用户
================================================= */

signInAnonymously(auth)
  .catch(error => {

    console.error(error);

    showToast(
      "无法连接服务器"
    );

  });


onAuthStateChanged(
  auth,
  async user => {

    if (!user) return;

    currentUser =
      user;

    await initializeRoom();

  }
);


/* =================================================
   判断 URL 中是否存在房间
================================================= */

async function initializeRoom() {

  const params =
    new URLSearchParams(
      window.location.search
    );

  const urlRoom =
    params.get("room");


  if (urlRoom) {

    roomId =
      urlRoom;

    await joinExistingRoom();

  }

  else {

    await createNewRoom();

  }

}


/* =================================================
   生成房间 ID
================================================= */

function generateRoomId() {

  const chars =
    "abcdefghijklmnopqrstuvwxyz" +
    "ABCDEFGHIJKLMNOPQRSTUVWXYZ" +
    "0123456789";

  let result = "";

  for (
    let i = 0;
    i < 12;
    i++
  ) {

    result +=
      chars[
        Math.floor(
          Math.random() *
          chars.length
        )
      ];

  }

  return result;

}


/* =================================================
   创建房间
================================================= */

async function createNewRoom() {

  roomId =
    generateRoomId();

  role =
    "owner";


  const roomRef =
    ref(
      db,
      `rooms/${roomId}`
    );


  const roomData = {

    active: true,

    ownerUid:
      currentUser.uid,

    guestUid: null,

    ownerAvatar:
      localStorage.getItem(
        "click_my_avatar"
      ) || defaultAvatar,

    guestAvatar:
      defaultAvatar,

    createdAt:
      Date.now(),

    status: null,

    lastMessage: null

  };


  await set(
    roomRef,
    roomData
  );


  localStorage.setItem(
    "click_owner_room",
    roomId
  );


  startRoomListener();

  updateUI();

}


/* =================================================
   加入已有房间
================================================= */

async function joinExistingRoom() {

  const roomRef =
    ref(
      db,
      `rooms/${roomId}`
    );


  const snapshot =
    await get(roomRef);


  if (!snapshot.exists()) {

    showInvalidRoom();

    return;

  }


  const room =
    snapshot.val();


  /* Owner 自己重新打开 */

  if (
    room.ownerUid ===
    currentUser.uid
  ) {

    role =
      "owner";

  }


  /* 已经是这个 Guest */

  else if (
    room.guestUid ===
    currentUser.uid
  ) {

    role =
      "guest";

  }


  /* 新 Guest */

  else if (
    room.guestUid === null &&
    room.active === true
  ) {

    role =
      "guest";


    await update(
      roomRef,
      {

        guestUid:
          currentUser.uid,

        guestAvatar:
          localStorage.getItem(
            "click_my_avatar"
          ) || defaultAvatar

      }
    );

  }


  else {

    showToast(
      "这个房间已经有其他成员"
    );

    return;

  }


  localStorage.setItem(
    "click_current_room",
    roomId
  );


  startRoomListener();

  updateUI();

}


/* =================================================
   房间实时监听
================================================= */

function startRoomListener() {

  if (roomListener) {

    roomListener();

  }


  const roomRef =
    ref(
      db,
      `rooms/${roomId}`
    );


  roomListener =
    onValue(
      roomRef,
      snapshot => {

        if (
          !snapshot.exists()
        ) {

          showInvalidRoom();

          return;

        }


        const room =
          snapshot.val();


        /* 房间被 Owner 关闭 */

        if (
          room.active !== true
        ) {

          if (
            role === "guest"
          ) {

            showInvalidRoom();

          }

          return;

        }


        /* Guest 被移除 */

        if (
          role === "guest" &&
          room.guestUid !==
          currentUser.uid
        ) {

          showInvalidRoom();

          return;

        }


        updateAvatars(
          room
        );


        updateConnectionUI(
          room
        );

      }
    );


  startMessageListener();

}


/* =================================================
   监听消息
================================================= */

function startMessageListener() {

  const messagesRef =
    ref(
      db,
      `rooms/${roomId}/messages`
    );


  let firstLoad = true;


  messageListener =
    onValue(
      messagesRef,
      snapshot => {

        const data =
          snapshot.val();


        if (!data) return;


        const messages =
          Object.values(data)
            .sort(
              (a,b) =>
                a.time - b.time
            );


        if (
          firstLoad
        ) {

          firstLoad = false;

          return;

        }


        const latest =
          messages[
            messages.length - 1
          ];


        if (!latest) return;


        if (
          latest.senderUid ===
          currentUser.uid
        ) {

          return;

        }


        showMessage(
          "对方",
          latest.message
        );

      }
    );

}


/* =================================================
   更新头像
================================================= */

function updateAvatars(
  room
) {

  ownerAvatar.src =
    room.ownerAvatar ||
    defaultAvatar;


  guestAvatar.src =
    room.guestAvatar ||
    defaultAvatar;


  if (
    role === "owner"
  ) {

    headerAvatar.src =
      room.ownerAvatar ||
      defaultAvatar;

  }

  else {

    headerAvatar.src =
      room.guestAvatar ||
      defaultAvatar;

  }

}


/* =================================================
   更新连接状态
================================================= */

function updateConnectionUI(
  room
) {

  if (
    room.guestUid
  ) {

    connectionStatus.textContent =
      "已连接";

  }

  else {

    connectionStatus.textContent =
      "等待对方加入";

  }


  roomInfo.textContent =
    `房间 ID：${roomId}`;

}


/* =================================================
   UI 身份
================================================= */

function updateUI() {

  if (
    role === "owner"
  ) {

    roleText.textContent =
      "你是这个 Click. 的主人";

    shareBtn.style.display =
      "block";

    leaveBtn.style.display =
      "block";

    leaveBtn.textContent =
      "断开链接";


    /*
      Owner 左侧头像可以修改
      Guest 右侧头像不能修改
    */

    document
      .getElementById(
        "ownerAvatarWrapper"
      )
      .classList.remove(
        "locked"
      );


    document
      .getElementById(
        "guestAvatarWrapper"
      )
      .classList.add(
        "locked"
      );

  }

  else {

    roleText.textContent =
      "你是被邀请加入的成员";

    shareBtn.style.display =
      "none";

    leaveBtn.style.display =
      "block";

    leaveBtn.textContent =
      "退出链接";


    /*
      Guest 左侧 Owner 头像不能修改
      Guest 右侧自己的头像可以修改
    */

    document
      .getElementById(
        "ownerAvatarWrapper"
      )
      .classList.add(
        "locked"
      );


    document
      .getElementById(
        "guestAvatarWrapper"
      )
      .classList.remove(
        "locked"
      );

  }

}


/* =================================================
   发送消息
================================================= */

async function sendMessage(
  title,
  message
) {

  if (
    !roomId ||
    !currentUser
  ) {

    showToast(
      "当前没有连接"
    );

    return;

  }


  const roomSnapshot =
    await get(
      ref(
        db,
        `rooms/${roomId}`
      )
    );


  if (
    !roomSnapshot.exists()
  ) {

    showToast(
      "房间已经失效"
    );

    return;

  }


  const room =
    roomSnapshot.val();


  if (
    room.active !== true
  ) {

    showToast(
      "房间已经断开"
    );

    return;

  }


  if (
    role === "guest" &&
    room.ownerUid ===
    currentUser.uid
  ) {

    return;

  }


  if (
    role === "owner" &&
    !room.guestUid
  ) {

    showToast(
      "对方还没有加入"
    );

    return;

  }


  const messagesRef =
    ref(
      db,
      `rooms/${roomId}/messages`
    );


  const newMessage =
    push(messagesRef);


  await set(
    newMessage,
    {

      senderUid:
        currentUser.uid,

      senderRole:
        role,

      title,

      message,

      time:
        Date.now()

    }
  );


  await update(
    ref(
      db,
      `rooms/${roomId}`
    ),
    {

      status:
        title,

      lastMessage:
        message

    }
  );


  showToast(
    "已发送"
  );

}


/* =================================================
   测试消息按钮
================================================= */

document
  .getElementById(
    "testMessageBtn"
  )
  .onclick = async () => {

    await sendMessage(
      "测试信息",
      "这是一条测试消息"
    );

  };


/* =================================================
   打开个人中心
================================================= */

document
  .getElementById(
    "openProfileBtn"
  )
  .onclick = () => {

    profileModal.classList.add(
      "active"
    );

    updateUI();

  };


/* =================================================
   Owner 获取邀请链接
================================================= */

shareBtn.onclick =
  async () => {

    if (
      role !== "owner"
    ) {

      return;

    }


    const roomRef =
      ref(
        db,
        `rooms/${roomId}`
      );


    const snapshot =
      await get(roomRef);


    if (
      !snapshot.exists()
    ) {

      showToast(
        "房间不存在"
      );

      return;

    }


    const shareUrl =
      `${window.location.origin}` +
      `${window.location.pathname}` +
      `?room=${roomId}`;


    try {

      await navigator.clipboard
        .writeText(
          shareUrl
        );


      showToast(
        "专属连接已复制"
      );


    }

    catch {

      prompt(
        "请复制下面的链接",
        shareUrl
      );

    }

  };


/* =================================================
   Owner 断开 / Guest 退出
================================================= */

leaveBtn.onclick =
  async () => {

    if (!roomId) return;


    const roomRef =
      ref(
        db,
        `rooms/${roomId}`
      );


    const snapshot =
      await get(roomRef);


    if (
      !snapshot.exists()
    ) {

      return;

    }


    const room =
      snapshot.val();


    /* =========================
       Owner 主动断开
    ========================= */

    if (
      role === "owner"
    ) {

      await update(
        roomRef,
        {

          active: false,

          guestUid: null

        }
      );


      localStorage.removeItem(
        "click_owner_room"
      );


      showToast(
        "链接已断开"
      );


      setTimeout(
        () => {

          window.history.replaceState(
            {},
            "",
            window.location.pathname
          );

          location.reload();

        },
        700
      );


      return;

    }


    /* =========================
       Guest 主动退出
    ========================= */

    if (
      role === "guest"
    ) {

      if (
        room.guestUid ===
        currentUser.uid
      ) {

        await update(
          roomRef,
          {

            guestUid: null,

            guestAvatar:
              defaultAvatar,

            status: null,

            lastMessage: null

          }
        );

      }


      localStorage.removeItem(
        "click_current_room"
      );


      showToast(
        "已退出链接"
      );


      setTimeout(
        () => {

          window.history.replaceState(
            {},
            "",
            window.location.pathname
          );

          location.reload();

        },
        700
      );

    }

  };


/* =================================================
   Owner 头像
================================================= */

document
  .getElementById(
    "ownerAvatarWrapper"
  )
  .onclick = () => {

    if (
      role !== "owner"
    ) {

      showToast(
        "这里只能查看对方头像"
      );

      return;

    }


    chooseAvatar(
      "owner"
    );

  };


/* =================================================
   Guest 头像
================================================= */

document
  .getElementById(
    "guestAvatarWrapper"
  )
  .onclick = () => {

    if (
      role !== "guest"
    ) {

      showToast(
        "这里只能查看对方头像"
      );

      return;

    }


    chooseAvatar(
      "guest"
    );

  };


/* =================================================
   选择头像
================================================= */

function chooseAvatar(
  avatarRole
) {

  const input =
    document.createElement(
      "input"
    );


  input.type =
    "file";


  input.accept =
    "image/png,image/jpeg,image/webp";


  input.onchange =
    event => {

      const file =
        event.target.files[0];


      if (!file) return;


      const reader =
        new FileReader();


      reader.onload =
        async e => {

          const imageData =
            e.target.result;


          localStorage.setItem(
            "click_my_avatar",
            imageData
          );


          const roomRef =
            ref(
              db,
              `rooms/${roomId}`
            );


          if (
            avatarRole ===
            "owner"
          ) {

            await update(
              roomRef,
              {

                ownerAvatar:
                  imageData

              }
            );

          }


          if (
            avatarRole ===
            "guest"
          ) {

            await update(
              roomRef,
              {

                guestAvatar:
                  imageData

              }
            );

          }


          showToast(
            "头像已更新"
          );

        };


      reader.readAsDataURL(
        file
      );

    };


  input.click();

}


/* =================================================
   无效房间
================================================= */

function showInvalidRoom() {

  if (roomListener) {

    roomListener();

    roomListener =
      null;

  }


  role = null;

  roomId = null;


  document.body.innerHTML = `

    <div style="
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:30px;
      font-family:-apple-system,
      BlinkMacSystemFont,
      sans-serif;
      background:#fafafa;
      text-align:center;
    ">

      <div>

        <div style="
          font-size:48px;
          margin-bottom:20px;
        ">
          ∞
        </div>

        <h2 style="
          font-weight:600;
          margin-bottom:10px;
        ">
          这个链接已经失效
        </h2>

        <p style="
          color:#888;
          line-height:1.6;
        ">
          房间可能已经被主人断开，
          或者这个邀请链接不存在。
        </p>

        <button
          onclick="location.href =
            location.origin +
            location.pathname"
          style="
            margin-top:20px;
            border:none;
            background:#262626;
            color:#fff;
            padding:13px 24px;
            border-radius:8px;
            font-size:15px;
          "
        >
          创建自己的 Click.
        </button>

      </div>

    </div>

  `;

}


/* =================================================
   防止 Owner 断网后留下错误状态
================================================= */

async function setupDisconnectProtection() {

  if (
    !currentUser ||
    !roomId
  ) return;


  const connectionRef =
    ref(
      db,
      `rooms/${roomId}/connections/${currentUser.uid}`
    );


  await onDisconnect(
    connectionRef
  ).remove();


  await set(
    connectionRef,
    {

      role,

      time:
        Date.now()

    }
  );

}


/* =================================================
   页面初始化完成
================================================= */

window.addEventListener(
  "load",
  () => {

    headerAvatar.src =
      defaultAvatar;

    ownerAvatar.src =
      defaultAvatar;

    guestAvatar.src =
      defaultAvatar;

  }
);

</script>

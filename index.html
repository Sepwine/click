<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,
  initial-scale=1.0,
  maximum-scale=1.0,
  user-scalable=no"
>

<title>Click.</title>

<meta
  name="apple-mobile-web-app-capable"
  content="yes"
>

<style>

:root {

  --bg-light: #fafafa;
  --text-main: #262626;
  --border-color: #dbdbdb;

}

* {

  box-sizing: border-box;

}

body {

  margin: 0;
  padding: 0;

  min-height: 100vh;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Helvetica,
    Arial,
    sans-serif;

  background:
    var(--bg-light);

  color:
    var(--text-main);

  user-select: none;

}


/* =========================
   顶栏
========================= */

header {

  height: 68px;

  display: flex;

  align-items: center;

  justify-content: space-between;

  padding: 0 18px;

  background: #fff;

  border-bottom:
    1px solid
    var(--border-color);

}

.header-left {

  display: flex;

  align-items: center;

  gap: 8px;

}

.logo {

  font-size: 1.2rem;

  font-weight: 600;

  letter-spacing: 1px;

  margin-right: 5px;

}

.header-btn {

  width: 36px;
  height: 36px;

  border-radius: 50%;

  border:
    1px solid
    var(--border-color);

  background: #fff;

  display: flex;

  align-items: center;
  justify-content: center;

  font-size: 16px;

  cursor: pointer;

  -webkit-tap-highlight-color:
    transparent;

}

.header-btn:active {

  transform: scale(.94);

  background: #f0f0f0;

}

.profile-trigger {

  width: 36px;
  height: 36px;

  border-radius: 50%;

  overflow: hidden;

  cursor: pointer;

  border:
    1px solid
    var(--border-color);

}

.profile-trigger img {

  width: 100%;
  height: 100%;

  object-fit: cover;

}


/* =========================
   主页面
========================= */

main {

  min-height:
    calc(100vh - 68px);

  display: flex;

  justify-content: center;

  align-items: flex-start;

  padding:
    30px 20px;

}

.button-container {

  display: grid;

  grid-template-columns:
    repeat(2, 1fr);

  gap: 15px;

  width: 100%;

  max-width: 350px;

}

.action-btn {

  background: #fff;

  border:
    1px solid
    var(--border-color);

  border-radius: 12px;

  padding:
    25px 15px;

  display: flex;

  flex-direction: column;

  align-items: center;

  gap: 12px;

  cursor: pointer;

  color:
    var(--text-main);

  transition:
    all .2s ease;

  position: relative;

}

.action-btn:active {

  background: #f0f0f0;

  transform: scale(.97);

}

.btn-icon {

  font-size: 2rem;

}

.btn-label {

  font-size: .9rem;

  font-weight: 500;

}

.add-btn {

  background: transparent;

  border:
    2px dashed
    var(--border-color);

  color: #999;

}


/* =========================
   Modal
========================= */

.modal-overlay {

  position: fixed;

  inset: 0;

  background:
    rgba(0,0,0,.4);

  backdrop-filter:
    blur(8px);

  display: flex;

  justify-content: center;

  align-items: flex-end;

  opacity: 0;

  pointer-events: none;

  transition:
    opacity .25s ease;

  z-index: 100;

}

.modal-overlay.active {

  opacity: 1;

  pointer-events: auto;

}

.modal-content {

  background: #fff;

  width: 100%;

  max-width: 450px;

  border-radius:
    20px 20px 0 0;

  padding:
    30px 20px;

  transform:
    translateY(100%);

  transition:
    transform .3s ease;

  max-height: 90vh;

  overflow-y: auto;

}

.modal-overlay.active
.modal-content {

  transform:
    translateY(0);

}


/* =========================
   头像
========================= */

.connection-avatars {

  display: flex;

  justify-content: center;

  align-items: center;

  gap: 20px;

  margin-bottom: 30px;

}

.avatar-wrapper {

  width: 70px;
  height: 70px;

  border-radius: 50%;

  padding: 3px;

  background:
    linear-gradient(
      45deg,
      #d3cce3,
      #e9e4f0
    );

  cursor: pointer;

  position: relative;

}

.avatar-wrapper img {

  width: 100%;
  height: 100%;

  border-radius: 50%;

  object-fit: cover;

  border:
    2px solid #fff;

}

.avatar-wrapper.locked {

  cursor: default;

  opacity: .9;

}

.avatar-wrapper.locked::after {

  content: "●";

  position: absolute;

  bottom: -5px;
  right: -5px;

  background: #aaa;

  color: #fff;

  width: 22px;
  height: 22px;

  border-radius: 50%;

  display: flex;

  align-items: center;
  justify-content: center;

  font-size: 7px;

  border:
    2px solid #fff;

}

.avatar-wrapper:not(.locked)::after {

  content: "+";

  position: absolute;

  bottom: -5px;
  right: -5px;

  background:
    var(--text-main);

  color: #fff;

  width: 22px;
  height: 22px;

  border-radius: 50%;

  display: flex;

  align-items: center;
  justify-content: center;

  font-size: 12px;

  font-weight: bold;

  border:
    2px solid #fff;

}

.mobius {

  font-size: 2rem;

  color: #999;

}

.role-text {

  text-align: center;

  color: #777;

  font-size: .85rem;

  margin-bottom: 20px;

}

.connection-status {

  text-align: center;

  font-size: .85rem;

  color: #777;

  margin-bottom: 20px;

}

.primary-btn {

  width: 100%;

  background:
    var(--text-main);

  color: #fff;

  border: none;

  padding:
    14px 24px;

  border-radius: 8px;

  font-size: 1rem;

  font-weight: 600;

  cursor: pointer;

  margin-top: 8px;

}

.danger-btn {

  background: #e5e5e5;

  color: #333;

}

.room-info {

  text-align: center;

  font-size: .75rem;

  color: #999;

  margin-top: 15px;

  word-break: break-all;

}


/* =========================
   输入框
========================= */

.input-group {

  margin-bottom: 15px;

}

.input-group label {

  display: block;

  font-size: .85rem;

  color: #666;

  margin-bottom: 5px;

}

.input-group input {

  width: 100%;

  padding: 12px;

  border:
    1px solid
    var(--border-color);

  border-radius: 8px;

  font-size: 1rem;

}


/* =========================
   Toast
========================= */

#toast {

  position: fixed;

  left: 50%;

  bottom: 30px;

  transform:
    translate(-50%,20px);

  background:
    rgba(40,40,40,.92);

  color: #fff;

  padding:
    12px 18px;

  border-radius: 10px;

  font-size: .9rem;

  opacity: 0;

  pointer-events: none;

  transition:
    all .25s ease;

  z-index: 1000;

  max-width: 85%;

  text-align: center;

}

#toast.show {

  opacity: 1;

  transform:
    translate(-50%,0);

}


/* =========================
   消息
========================= */

#messagePopup {

  position: fixed;

  top: 85px;

  left: 50%;

  transform:
    translateX(-50%)
    translateY(-20px);

  width:
    calc(100% - 40px);

  max-width: 380px;

  background: #fff;

  border:
    1px solid
    var(--border-color);

  border-radius: 14px;

  padding: 15px;

  box-shadow:
    0 8px 30px
    rgba(0,0,0,.15);

  opacity: 0;

  pointer-events: none;

  transition:
    all .3s ease;

  z-index: 900;

}

#messagePopup.show {

  opacity: 1;

  transform:
    translateX(-50%)
    translateY(0);

}

.popup-title {

  font-size: .8rem;

  color: #888;

  margin-bottom: 5px;

}

.popup-message {

  font-size: 1rem;

  color: #222;

  line-height: 1.5;

}


/* =========================
   无效房间
========================= */

.invalid-room {

  min-height: 100vh;

  display: flex;

  align-items: center;

  justify-content: center;

  padding: 30px;

  text-align: center;

}

</style>

</head>


<body>


<header>

  <div class="header-left">

    <div class="logo">
      Click.
    </div>


    <!-- 测试消息 -->

    <button
      class="header-btn"
      id="testMessageBtn"
      title="发送测试消息"
    >
      ♢
    </button>


    <!-- 美化入口 -->

    <button
      class="header-btn"
      id="styleBtn"
      title="页面美化"
    >
      Aa
    </button>

  </div>


  <div
    class="profile-trigger"
    id="openProfileBtn"
  >

    <img
      id="headerAvatar"
      src=""
      alt=""
    >

  </div>

</header>


<main>

  <div
    class="button-container"
    id="buttonContainer"
  ></div>

</main>


<!-- =========================
     个人中心
========================= -->

<div
  class="modal-overlay"
  id="profileModal"
>

  <div class="modal-content">


    <div class="connection-avatars">


      <!-- Owner -->

      <div
        class="avatar-wrapper"
        id="ownerAvatarWrapper"
      >

        <img
          id="ownerAvatar"
          src=""
          alt=""
        >

      </div>


      <div class="mobius">
        ∞
      </div>


      <!-- Guest -->

      <div
        class="avatar-wrapper"
        id="guestAvatarWrapper"
      >

        <img
          id="guestAvatar"
          src=""
          alt=""
        >

      </div>

    </div>


    <div
      class="role-text"
      id="roleText"
    >
      正在连接
    </div>


    <div
      class="connection-status"
      id="connectionStatus"
    >
      正在初始化
    </div>


    <button
      class="primary-btn"
      id="shareBtn"
    >
      🔗 获取专属连接
    </button>


    <button
      class="primary-btn danger-btn"
      id="leaveBtn"
    >
      退出
    </button>


    <div
      class="room-info"
      id="roomInfo"
    ></div>

  </div>

</div>


<!-- =========================
     新建状态
========================= -->

<div
  class="modal-overlay"
  id="addBtnModal"
>

  <div class="modal-content">

    <h3>
      新建状态按钮
    </h3>


    <div class="input-group">

      <label>
        Emoji 图标
      </label>

      <input
        id="newIcon"
        type="text"
        placeholder="例如：🎮"
        maxlength="2"
      >

    </div>


    <div class="input-group">

      <label>
        按钮名称
      </label>

      <input
        id="newLabel"
        type="text"
        placeholder="例如：打游戏"
        maxlength="6"
      >

    </div>


    <div class="input-group">

      <label>
        推送给对方的消息
      </label>

      <input
        id="newMsg"
        type="text"
        placeholder="例如：对方正在打游戏"
      >

    </div>


    <button
      class="primary-btn"
      id="saveNewBtn"
    >
      保存
    </button>

  </div>

</div>


<!-- =========================
     消息
========================= -->

<div id="messagePopup">

  <div
    class="popup-title"
    id="popupTitle"
  >
    对方
  </div>

  <div
    class="popup-message"
    id="popupMessage"
  ></div>

</div>


<div id="toast"></div>


<script type="module">


/* =====================================================
   Supabase 配置
===================================================== */

import {
  createClient
}
from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


/*
========================================================
  只修改这里
========================================================
*/

const SUPABASE_URL =
  "https://acuqmpgvaeuylmfckxdr.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_E4qydEgRdGGUwrRw_ZiKIw_3AOC5xSZ";


/*
========================================================
  初始化
========================================================
*/

const supabase =
  createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================================
   默认头像
===================================================== */

const defaultAvatar =
  "data:image/svg+xml;utf8," +
  "<svg xmlns='http://www.w3.org/2000/svg' " +
  "viewBox='0 0 100 100'>" +

  "<rect fill='%23eeeeee' " +
  "width='100' height='100'/>" +

  "<circle " +
  "cx='50' cy='38' r='18' " +
  "fill='%23bbbbbb'/>" +

  "<path " +
  "d='M20 90 C20 65 80 65 80 90' " +
  "fill='%23bbbbbb'/>" +

  "</svg>";


/* =====================================================
   用户身份
===================================================== */

let myId = null;

async function initUser() {

  const {
    data: {
      user
    },
    error
  } = await supabase.auth.signInAnonymously();

  if (error) {

    console.error(error);

    showToast(
      "匿名身份创建失败"
    );

    return false;

  }

  myId = user.id;

  return true;

}


let role =
  null;


let roomId =
  null;


let realtimeChannel =
  null;


/* =====================================================
   DOM
===================================================== */

const container =
  document.getElementById(
    "buttonContainer"
  );


const profileModal =
  document.getElementById(
    "profileModal"
  );


const addBtnModal =
  document.getElementById(
    "addBtnModal"
  );


const ownerAvatar =
  document.getElementById(
    "ownerAvatar"
  );


const guestAvatar =
  document.getElementById(
    "guestAvatar"
  );


const headerAvatar =
  document.getElementById(
    "headerAvatar"
  );


const roleText =
  document.getElementById(
    "roleText"
  );


const connectionStatus =
  document.getElementById(
    "connectionStatus"
  );


const roomInfo =
  document.getElementById(
    "roomInfo"
  );


const shareBtn =
  document.getElementById(
    "shareBtn"
  );


const leaveBtn =
  document.getElementById(
    "leaveBtn"
  );


const toast =
  document.getElementById(
    "toast"
  );


const messagePopup =
  document.getElementById(
    "messagePopup"
  );


const popupTitle =
  document.getElementById(
    "popupTitle"
  );


const popupMessage =
  document.getElementById(
    "popupMessage"
  );


/* =====================================================
   默认状态
===================================================== */

const defaultButtons = [

  {
    id: "eat",
    icon: "🍴",
    label: "吃饭",
    msg: "对方准备去吃饭了"
  },

  {
    id: "sleep",
    icon: "🌙",
    label: "睡觉",
    msg: "对方困了，准备休息"
  }

];


let savedButtons =
  JSON.parse(
    localStorage.getItem(
      "click_custom_buttons"
    )
  ) ||
  defaultButtons;


/* =====================================================
   Toast
===================================================== */

function showToast(text) {

  toast.textContent =
    text;

  toast.classList.add(
    "show"
  );

  setTimeout(
    () => {

      toast.classList.remove(
        "show"
      );

    },
    2500
  );

}


/* =====================================================
   消息
===================================================== */

function showMessage(
  title,
  message
) {

  popupTitle.textContent =
    title;

  popupMessage.textContent =
    message;

  messagePopup.classList.add(
    "show"
  );

  setTimeout(
    () => {

      messagePopup.classList.remove(
        "show"
      );

    },
    3500
  );

}


/* =====================================================
   房间 ID
===================================================== */

function generateRoomId() {

  return crypto
    .randomUUID()
    .replaceAll("-", "")
    .substring(0, 12);

}


/* =====================================================
   初始化
===================================================== */

async function init() {

  ownerAvatar.src =
    defaultAvatar;

  guestAvatar.src =
    defaultAvatar;

  headerAvatar.src =
    defaultAvatar;


  const params =
    new URLSearchParams(
      window.location.search
    );


  const urlRoom =
    params.get("room");


  if (urlRoom) {

    await joinRoom(
      urlRoom
    );

  }

  else {

    await createRoom();

  }


  renderButtons();

}


/* =====================================================
   创建房间
===================================================== */

async function createRoom() {

  roomId =
    generateRoomId();

  role =
    "owner";


  const avatar =
    localStorage.getItem(
      "click_my_avatar"
    ) ||
    defaultAvatar;


  const { error } =
    await supabase
      .from("rooms")
      .insert({

        id: roomId,

        owner_id: myId,

        guest_id: null,

        owner_avatar: avatar,

        guest_avatar:
          defaultAvatar,

        active: true

      });


  if (error) {

    console.error(error);

    showToast(
      "创建房间失败"
    );

    return;

  }


  localStorage.setItem(
    "click_owner_room",
    roomId
  );


  window.history.replaceState(
    {},
    "",
    `${window.location.pathname}?room=${roomId}`
  );


  startRealtime();

  updateUI();

}


/* =====================================================
   加入房间
===================================================== */

async function joinRoom(
  id
) {

  roomId =
    id;


  const { data, error } =
    await supabase
      .from("rooms")
      .select("*")
      .eq("id", roomId)
      .maybeSingle();


  if (
    error ||
    !data
  ) {

    showInvalidRoom();

    return;

  }


  if (
    data.active !== true
  ) {

    showInvalidRoom();

    return;

  }


  /* Owner */

  if (
    data.owner_id === myId
  ) {

    role =
      "owner";

  }


  /* 原来的 Guest */

  else if (
    data.guest_id === myId
  ) {

    role =
      "guest";

  }


  /* 新 Guest */

  else if (
    data.guest_id === null
  ) {

    role =
      "guest";


    const avatar =
      localStorage.getItem(
        "click_my_avatar"
      ) ||
      defaultAvatar;


    const { error:
      updateError
    } =
      await supabase
        .from("rooms")
        .update({

          guest_id:
            myId,

          guest_avatar:
            avatar

        })
        .eq(
          "id",
          roomId
        );


    if (updateError) {

      console.error(
        updateError
      );

      showToast(
        "加入房间失败"
      );

      return;

    }

  }


  else {

    showToast(
      "这个房间已经有成员"
    );

    return;

  }


  localStorage.setItem(
    "click_current_room",
    roomId
  );


  startRealtime();

  updateUI();


  await loadRoom();

}


/* =====================================================
   获取房间
===================================================== */

async function loadRoom() {

  const { data } =
    await supabase
      .from("rooms")
      .select("*")
      .eq("id", roomId)
      .maybeSingle();


  if (!data) {

    showInvalidRoom();

    return;

  }


  updateAvatars(
    data
  );

}


/* =====================================================
   实时监听
===================================================== */

function startRealtime() {

  if (
    realtimeChannel
  ) {

    supabase.removeChannel(
      realtimeChannel
    );

  }


  realtimeChannel =
    supabase
      .channel(
        `click-room-${roomId}`
      )


      /* 房间 */

      .on(

        "postgres_changes",

        {

          event: "*",

          schema: "public",

          table: "rooms",

          filter:
            `id=eq.${roomId}`

        },

        payload => {

          if (
            payload.eventType ===
            "DELETE"
          ) {

            showInvalidRoom();

            return;

          }


          const room =
            payload.new;


          if (
            room.active !== true
          ) {

            showInvalidRoom();

            return;

          }


          if (
            role === "guest" &&
            room.guest_id !== myId
          ) {

            showInvalidRoom();

            return;

          }


          updateAvatars(
            room
          );

          updateConnectionUI(
            room
          );

        }

      )


      /* 消息 */

      .on(

        "postgres_changes",

        {

          event: "INSERT",

          schema: "public",

          table: "messages",

          filter:
            `room_id=eq.${roomId}`

        },

        payload => {

          const message =
            payload.new;


          if (
            message.sender_id ===
            myId
          ) {

            return;

          }


          showMessage(

            "对方",

            message.message

          );

        }

      )


      .subscribe();

}


/* =====================================================
   头像
===================================================== */

function updateAvatars(
  room
) {

  ownerAvatar.src =
    room.owner_avatar ||
    defaultAvatar;


  guestAvatar.src =
    room.guest_avatar ||
    defaultAvatar;


  if (
    role === "owner"
  ) {

    headerAvatar.src =
      room.owner_avatar ||
      defaultAvatar;

  }

  else {

    headerAvatar.src =
      room.guest_avatar ||
      defaultAvatar;

  }

}


/* =====================================================
   UI
===================================================== */

function updateUI() {

  if (
    role === "owner"
  ) {

    roleText.textContent =
      "你是这个 Click. 的主人";

    shareBtn.style.display =
      "block";

    leaveBtn.textContent =
      "断开链接";


    document
      .getElementById(
        "ownerAvatarWrapper"
      )
      .classList.remove(
        "locked"
      );


    document
      .getElementById(
        "guestAvatarWrapper"
      )
      .classList.add(
        "locked"
      );

  }


  else {

    roleText.textContent =
      "你是被邀请的成员";

    shareBtn.style.display =
      "none";

    leaveBtn.textContent =
      "退出链接";


    document
      .getElementById(
        "ownerAvatarWrapper"
      )
      .classList.add(
        "locked"
      );


    document
      .getElementById(
        "guestAvatarWrapper"
      )
      .classList.remove(
        "locked"
      );

  }


  roomInfo.textContent =
    roomId
      ? `房间 ID：${roomId}`
      : "";

}


/* =====================================================
   连接状态
===================================================== */

function updateConnectionUI(
  room
) {

  if (
    room.guest_id
  ) {

    connectionStatus.textContent =
      "已连接";

  }

  else {

    connectionStatus.textContent =
      "等待对方加入";

  }

}


/* =====================================================
   发送消息
===================================================== */

async function sendMessage(
  title,
  message
) {

  if (
    !roomId
  ) {

    showToast(
      "当前没有房间"
    );

    return;

  }


  const { data: room } =
    await supabase
      .from("rooms")
      .select("*")
      .eq("id", roomId)
      .maybeSingle();


  if (
    !room ||
    room.active !== true
  ) {

    showToast(
      "房间已经失效"
    );

    return;

  }


  if (
    role === "owner" &&
    !room.guest_id
  ) {

    showToast(
      "对方还没有加入"
    );

    return;

  }


  if (
    role === "guest" &&
    room.guest_id !== myId
  ) {

    showToast(
      "你已经退出这个房间"
    );

    return;

  }


  const { error } =
    await supabase
      .from("messages")
      .insert({

        room_id:
          roomId,

        sender_id:
          myId,

        sender_role:
          role,

        title:
          title,

        message:
          message

      });


  if (error) {

    console.error(error);

    showToast(
      "消息发送失败"
    );

    return;

  }


  showToast(
    "已发送"
  );

}

   测试消息
===================================================== */

document

/* =====================================================
   新建按钮
===================================================== */

document
  .getElementById(
    "saveNewBtn"
  )
  .onclick =
  () => {

    const icon =
      document
        .getElementById(
          "newIcon"
        )
        .value ||
      "✨";


    const label =
      document
        .getElementById(
          "newLabel"
        )
        .value ||
      "新状态";


    const msg =
      document
        .getElementById(
          "newMsg"
        )
        .value ||
      "对方发送了一个新状态";


    savedButtons.push({

      id:
        Date.now()
        .toString(),

      icon,

      label,

      msg

    });


    localStorage.setItem(
      "click_custom_buttons",
      JSON.stringify(
        savedButtons
      )
    );


    renderButtons();


    document
      .getElementById(
        "newIcon"
      )
      .value = "";


    document
      .getElementById(
        "newLabel"
      )
      .value = "";


    document
      .getElementById(
        "newMsg"
      )
      .value = "";


    addBtnModal
      .classList
      .remove(
        "active"
      );

  };


/* =====================================================
   状态按钮
===================================================== */

function renderButtons() {

  container.innerHTML =
    "";


  savedButtons.forEach(
    (btn, index) => {

      const el =
        document
          .createElement(
            "div"
          );


      el.className =
        "action-btn";


      el.innerHTML = `

        <span class="btn-icon">
          ${btn.icon}
        </span>

        <span class="btn-label">
          ${btn.label}
        </span>

      `;


      let timer;


      el.addEventListener(
        "touchstart",
        () => {

          timer =
            setTimeout(
              () => {

                if (
                  confirm(
                    `确定删除「${btn.label}」吗？`
                  )
                ) {

                  savedButtons.splice(
                    index,
                    1
                  );


                  localStorage.setItem(
                    "click_custom_buttons",
                    JSON.stringify(
                      savedButtons
                    )
                  );


                  renderButtons();

                }

              },
              800
            );

        }
      );


      el.addEventListener(
        "touchend",
        () => {

          clearTimeout(
            timer
          );

        }
      );


      el.onclick =
        () => {

          sendMessage(
            btn.label,
            btn.msg
          );

        };


      container.appendChild(
        el
      );

    }
  );


  const add =
    document
      .createElement(
        "div"
      );


  add.className =
    "action-btn add-btn";


  add.innerHTML = `

    <span class="btn-icon">
      ＋
    </span>

    <span class="btn-label">
      添加状态
    </span>

  `;


  add.onclick =
    () => {

      addBtnModal
        .classList
        .add(
          "active"
        );

    };


  container.appendChild(
    add
  );

}

/* =====================================================
   分享链接
===================================================== */

shareBtn.onclick =
  async () => {

    if (
      role !== "owner"
    ) {

      return;

    }


    const url =
      `${window.location.origin}` +
      `${window.location.pathname}` +
      `?room=${roomId}`;


    try {

      await navigator
        .clipboard
        .writeText(
          url
        );


      showToast(
        "专属链接已复制"
      );

    }

    catch {

      prompt(
        "复制下面的专属链接",
        url
      );

    }

  };


/* =====================================================
   Owner 断开 / Guest 退出
===================================================== */

leaveBtn.onclick =
  async () => {

    if (
      !roomId
    ) return;


    if (
      role === "owner"
    ) {

      /*
        Owner 断开：
        房间 active = false
      */

      const { error } =
        await supabase
          .from("rooms")
          .update({

            active:
              false

          })
          .eq(
            "id",
            roomId
          );


      if (error) {

        showToast(
          "断开失败"
        );

        return;

      }


      localStorage.removeItem(
        "click_owner_room"
      );


      window.location.href =
        window.location.pathname;


      return;

    }


    if (
      role === "guest"
    ) {

      /*
        Guest 离开：
        只清空 guest
      */

      const { error } =
        await supabase
          .from("rooms")
          .update({

            guest_id:
              null,

            guest_avatar:
              defaultAvatar

          })
          .eq(
            "id",
            roomId
          )
          .eq(
            "guest_id",
            myId
          );


      if (error) {

        showToast(
          "退出失败"
        );

        return;

      }


      localStorage.removeItem(
        "click_current_room"
      );


      window.location.href =
        window.location.pathname;

    }

  };


/* =====================================================
   头像选择
===================================================== */

function chooseAvatar(
  avatarRole
) {

  const input =
    document
      .createElement(
        "input"
      );


  input.type =
    "file";


  input.accept =
    "image/png,image/jpeg,image/webp";


  input.onchange =
    event => {

      const file =
        event
          .target
          .files[0];


      if (!file) return;


      const reader =
        new FileReader();


      reader.onload =
        async e => {

          const image =
            e.target.result;


          localStorage.setItem(
            "click_my_avatar",
            image
          );


          const field =
            avatarRole ===
            "owner"
              ? "owner_avatar"
              : "guest_avatar";


          const { error } =
            await supabase
              .from("rooms")
              .update({

                [field]:
                  image

              })
              .eq(
                "id",
                roomId
              );


          if (error) {

            console.error(
              error
            );

            showToast(
              "头像更新失败"
            );

            return;

          }


          showToast(
            "头像已更新"
          );

        };


      reader.readAsDataURL(
        file
      );

    };


  input.click();

}

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Click</title>
  <!-- 这一行非常重要，是让网页可以添加到主屏幕并全屏显示的关键 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <style>
    :root {
      --bg-color: #f4f4f9;
      --btn-bg: #ffffff;
      --text-color: #333333;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 30px;
      opacity: 0.8;
    }
    .button-container {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      width: 100%;
      max-width: 400px;
    }
    .action-btn {
      background-color: var(--btn-bg);
      border: none;
      border-radius: 20px;
      padding: 30px 20px;
      font-size: 1.2rem;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      transition: transform 0.1s;
      -webkit-tap-highlight-color: transparent;
    }
    .action-btn:active {
      transform: scale(0.95);
    }
    .btn-icon {
      font-size: 2.5rem;
    }
  </style>
</head>
<body>

  <h1>我们的专属频道</h1>
  <div class="button-container" id="buttonContainer">
    <!-- 按钮会通过 JavaScript 动态生成到这里 -->
  </div>

  <script>
    // JSON 配置：你可以随时在这里修改按钮内容、图标和消息
    const buttonsConfig = [
      { id: "btn_eat", icon: "🍚", label: "我吃饭啦", message: "对方准备去吃饭了！" },
      { id: "btn_sleep", icon: "💤", label: "我睡觉啦", message: "对方困了，准备休息咯~" },
      { id: "btn_home", icon: "🏠", label: "我到家啦", message: "对方到家了！" },
      { id: "btn_miss", icon: "💞", label: "我想你了", message: "对方正在想你！" },
      { id: "btn_work", icon: "💻", label: "开始工作", message: "对方开始认真工作/学习了！" }
    ];

    const container = document.getElementById('buttonContainer');

    // 动态渲染按钮
    buttonsConfig.forEach(btn => {
      const buttonElement = document.createElement('button');
      buttonElement.className = 'action-btn';
      buttonElement.innerHTML = `
        <span class="btn-icon">${btn.icon}</span>
        <span class="btn-label">${btn.label}</span>
      `;
      
      // 绑定点击事件
      buttonElement.addEventListener('click', () => {
        console.log(`准备发送消息: ${btn.message}`);
        // 这里的提示暂时用来测试，之后会替换成真实的网络请求
        alert(`测试: 将发送消息 "${btn.message}"`); 
      });

      container.appendChild(buttonElement);
    });
  </script>
</body>
</html>

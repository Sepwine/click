<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Click.</title>

<meta
  name="apple-mobile-web-app-capable"
  content="yes"
>

<style>

:root {
  --bg: #fafafa;
  --text: #262626;
  --border: #dbdbdb;
  --card: #ffffff;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Helvetica,
    Arial,
    sans-serif;

  background: var(--bg);
  color: var(--text);

  user-select: none;
}


/* =========================
   顶栏
========================= */

header {
  height: 68px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  padding: 0 18px;

  background: var(--card);

  border-bottom:
    1px solid var(--border);
}

.header-left {
  display: flex;
  align-items: center;
  gap: 8px;
}

.logo {
  font-size: 1.2rem;
  font-weight: 600;
  letter-spacing: 1px;
  margin-right: 5px;
}

.header-btn {
  width: 36px;
  height: 36px;

  border-radius: 50%;

  border:
    1px solid var(--border);

  background: #fff;

  color: var(--text);

  display: flex;
  align-items: center;
  justify-content: center;

  cursor: pointer;

  -webkit-tap-highlight-color:
    transparent;
}

.header-btn:active {
  transform: scale(.94);
  background: #f0f0f0;
}

.profile-trigger {
  width: 36px;
  height: 36px;

  border-radius: 50%;

  overflow: hidden;

  border:
    1px solid var(--border);

  cursor: pointer;
}

.profile-trigger img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}


/* =========================
   主页面
========================= */

main {
  min-height:
    calc(100vh - 68px);

  padding: 30px 20px;

  display: flex;
  justify-content: center;
  align-items: flex-start;
}

.button-container {
  width: 100%;
  max-width: 350px;

  display: grid;

  grid-template-columns:
    repeat(2, 1fr);

  gap: 15px;
}

.action-btn {
  background: var(--card);

  border:
    1px solid var(--border);

  border-radius: 12px;

  padding: 25px 15px;

  display: flex;
  flex-direction: column;

  align-items: center;
  justify-content: center;

  gap: 12px;

  cursor: pointer;

  transition:
    transform .15s ease,
    background .15s ease;
}

.action-btn:active {
  transform: scale(.97);
  background: #f0f0f0;
}

.btn-icon {
  font-size: 2rem;
}

.btn-label {
  font-size: .9rem;
  font-weight: 500;
}

.add-btn {
  background: transparent;

  border:
    2px dashed var(--border);

  color: #999;
}


/* =========================
   Modal
========================= */

.modal-overlay {
  position: fixed;

  inset: 0;

  background:
    rgba(0,0,0,.4);

  backdrop-filter:
    blur(8px);

  display: flex;

  justify-content: center;
  align-items: flex-end;

  opacity: 0;

  pointer-events: none;

  transition:
    opacity .25s ease;

  z-index: 100;
}

.modal-overlay.active {
  opacity: 1;
  pointer-events: auto;
}

.modal-content {
  width: 100%;
  max-width: 450px;

  max-height: 90vh;

  overflow-y: auto;

  background: #fff;

  border-radius:
    20px 20px 0 0;

  padding: 30px 20px;

  transform:
    translateY(100%);

  transition:
    transform .3s ease;
}

.modal-overlay.active
.modal-content {
  transform:
    translateY(0);
}


/* =========================
   头像
========================= */

.connection-avatars {
  display: flex;

  justify-content: center;
  align-items: center;

  gap: 20px;

  margin-bottom: 25px;
}

.avatar-wrapper {
  width: 70px;
  height: 70px;

  padding: 3px;

  border-radius: 50%;

  background:
    linear-gradient(
      45deg,
      #d3cce3,
      #e9e4f0
    );

  position: relative;

  cursor: pointer;
}

.avatar-wrapper img {
  width: 100%;
  height: 100%;

  object-fit: cover;

  border-radius: 50%;

  border:
    2px solid #fff;
}

.avatar-wrapper::after {
  content: "+";

  position: absolute;

  right: -5px;
  bottom: -5px;

  width: 22px;
  height: 22px;

  border-radius: 50%;

  background:
    var(--text);

  color: #fff;

  display: flex;

  align-items: center;
  justify-content: center;

  font-size: 12px;
  font-weight: bold;

  border:
    2px solid #fff;
}

.avatar-wrapper.locked {
  cursor: default;
}

.avatar-wrapper.locked::after {
  content: "●";

  background: #aaa;

  font-size: 7px;
}

.mobius {
  font-size: 2rem;
  color: #999;
}

.role-text {
  text-align: center;

  font-size: .9rem;

  margin-bottom: 8px;
}

.connection-status {
  text-align: center;

  font-size: .8rem;

  color: #888;

  margin-bottom: 20px;
}


/* =========================
   普通按钮
========================= */

.primary-btn {
  width: 100%;

  border: none;

  background:
    var(--text);

  color: #fff;

  padding: 14px 20px;

  border-radius: 8px;

  font-size: 1rem;

  font-weight: 600;

  cursor: pointer;

  margin-top: 8px;
}

.secondary-btn {
  background: #eee;
  color: #333;
}

.danger-btn {
  background: #e8e8e8;
  color: #333;
}


/* =========================
   表单
========================= */

.input-group {
  margin-bottom: 15px;
}

.input-group label {
  display: block;

  font-size: .85rem;

  color: #666;

  margin-bottom: 5px;
}

.input-group input {
  width: 100%;

  padding: 12px;

  border:
    1px solid var(--border);

  border-radius: 8px;

  font-size: 1rem;

  outline: none;
}

.input-group input:focus {
  border-color:
    var(--text);
}


/* =========================
   房间信息
========================= */

.room-info {
  margin-top: 15px;

  text-align: center;

  font-size: .72rem;

  color: #999;

  word-break: break-all;
}


/* =========================
   消息记录
========================= */

.history-section {
  margin-top: 22px;

  border-top:
    1px solid var(--border);

  padding-top: 20px;
}

.history-header {
  display: flex;

  align-items: center;
  justify-content: space-between;

  margin-bottom: 12px;
}

.history-title {
  font-size: .95rem;
  font-weight: 600;
}

.history-clear {
  border: none;

  background: transparent;

  color: #999;

  font-size: .75rem;

  padding: 5px;

  cursor: pointer;
}

.history-list {
  max-height: 260px;

  overflow-y: auto;
}

.history-empty {
  text-align: center;

  color: #aaa;

  font-size: .82rem;

  padding: 25px 10px;
}

.history-item {
  padding: 12px 0;

  border-bottom:
    1px solid #eee;
}

.history-item:last-child {
  border-bottom: none;
}

.history-top {
  display: flex;

  align-items: center;
  justify-content: space-between;

  gap: 10px;

  margin-bottom: 4px;
}

.history-name {
  font-size: .82rem;

  color: #777;

  font-weight: 500;
}

.history-time {
  font-size: .7rem;

  color: #aaa;

  white-space: nowrap;
}

.history-title-text {
  font-size: .92rem;

  font-weight: 500;

  margin-bottom: 3px;
}

.history-message {
  font-size: .8rem;

  color: #777;

  line-height: 1.5;
}


/* =========================
   消息弹窗
========================= */

#messagePopup {
  position: fixed;

  top: 85px;
  left: 50%;

  width:
    calc(100% - 40px);

  max-width: 380px;

  padding: 15px;

  background: #fff;

  border:
    1px solid var(--border);

  border-radius: 14px;

  box-shadow:
    0 8px 30px
    rgba(0,0,0,.15);

  transform:
    translate(-50%, -20px);

  opacity: 0;

  pointer-events: none;

  transition:
    all .25s ease;

  z-index: 900;
}

#messagePopup.show {
  opacity: 1;

  transform:
    translate(-50%, 0);
}

.popup-title {
  color: #888;

  font-size: .8rem;

  margin-bottom: 5px;
}

.popup-message {
  font-size: 1rem;

  line-height: 1.5;
}


/* =========================
   Toast
========================= */

#toast {
  position: fixed;

  left: 50%;
  bottom: 30px;

  transform:
    translate(-50%, 20px);

  background:
    rgba(40,40,40,.92);

  color: #fff;

  padding:
    12px 18px;

  border-radius: 10px;

  font-size: .9rem;

  opacity: 0;

  pointer-events: none;

  transition:
    all .25s ease;

  z-index: 1000;

  max-width: 85%;

  text-align: center;
}

#toast.show {
  opacity: 1;

  transform:
    translate(-50%, 0);
}


/* =========================
   无效房间
========================= */

.invalid-room {
  min-height: 100vh;

  display: flex;

  align-items: center;
  justify-content: center;

  padding: 30px;

  text-align: center;
}

</style>

</head>


<body>


<header>

    <button

</header>


<main>

</main>


<!-- =========================

========================= -->

<div

  id="profileModal"
>

  <div class="modal-content">

    <div class="connection-avatars">

      <div

      </div>

      >

</div>


<!-- =========================

========================= -->

<div

>

  <div class="modal-content">

    <h3>

    </h3>


    <div class="input-group">

      >

</div>


<!-- =========================

========================= -->

<div id="messagePopup">

  <div

    对方
  </div>

  <div

</div>


<div id="toast"></div>


<script type="module">


/* =====================================================
   Supabase
===================================================== */

import {
  createClient
}
from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


const SUPABASE_URL =
  "https://acuqmpgvaeuylmfckxdr.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_E4qydEgRdGGUwrRw_ZiKIw_3AOC5xSZ";


const supabase =
  createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================================
   默认头像
===================================================== */

const defaultAvatar =
  "data:image/svg+xml;utf8," +
  "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'>" +
  "<rect width='100' height='100' fill='%23eeeeee'/>" +
  "<circle cx='50' cy='38' r='18' fill='%23bbbbbb'/>" +
  "<path d='M20 90 C20 65 80 65 80 90' fill='%23bbbbbb'/>" +
  "</svg>";


/* =====================================================
   DOM
===================================================== */

const container =
  document.getElementById(
    "buttonContainer"
  );

const profileModal =
  document.getElementById(
    "profileModal"
  );

const addBtnModal =
  document.getElementById(
    "addBtnModal"
  );

const ownerAvatar =
  document.getElementById(
    "ownerAvatar"
  );

const guestAvatar =
  document.getElementById(
    "guestAvatar"
  );

const headerAvatar =
  document.getElementById(
    "headerAvatar"
  );

const roleText =
  document.getElementById(
    "roleText"
  );

const connectionStatus =
  document.getElementById(
    "connectionStatus"
  );

const roomInfo =
  document.getElementById(
    "roomInfo"
  );

const shareBtn =
  document.getElementById(
    "shareBtn"
  );

const leaveBtn =
  document.getElementById(
    "leaveBtn"
  );

const toast =
  document.getElementById(
    "toast"
  );

const messagePopup =
  document.getElementById(
    "messagePopup"
  );

const popupTitle =
  document.getElementById(
    "popupTitle"
  );

const popupMessage =
  document.getElementById(
    "popupMessage"
  );

const historyList =
  document.getElementById(
    "historyList"
  );


/* =====================================================
   当前状态
===================================================== */

let myId = null;

let roomId = null;

let role = null;

let realtimeChannel = null;


/* =====================================================
   默认按钮
===================================================== */

const defaultButtons = [

  {
    id: "eat",
    icon: "🍴",
    label: "吃饭",
    msg: "对方准备去吃饭了"
  },

  {
    id: "sleep",
    icon: "🌙",
    label: "睡觉",
    msg: "对方困了，准备休息"
  }

];


let savedButtons =
  JSON.parse(
    localStorage.getItem(
      "click_custom_buttons"
    )
  ) ||
  defaultButtons;


/* =====================================================
   Toast
===================================================== */

function showToast(
  text
) {

  toast.textContent =
    text;

  toast.classList.add(
    "show"
  );

  setTimeout(
    () => {

      toast.classList.remove(
        "show"
      );

    },
    2500
  );

}


/* =====================================================
   消息弹窗
===================================================== */

function showMessage(
  title,
  message
) {

  popupTitle.textContent =
    title;

  popupMessage.textContent =
    message;

  messagePopup.classList.add(
    "show"
  );

  setTimeout(
    () => {

      messagePopup.classList.remove(
        "show"
      );

    },
    3500
  );

}


/* =====================================================
   获得匿名 Supabase 用户
===================================================== */

async function initUser() {

  const {
    data: {
      session
    }
  } =
    await supabase
      .auth
      .getSession();


  if (
    session &&
    session.user
  ) {

    myId =
      session.user.id;

    return true;

  }


  const {
    data,
    error
  } =
    await supabase
      .auth
      .signInAnonymously();


  if (error) {

    console.error(
      "Anonymous Auth error:",
      error
    );

    showToast(
      "匿名身份创建失败，请检查 Supabase Anonymous Sign-ins"
    );

    return false;

  }


  if (
    !data ||
    !data.user
  ) {

    showToast(
      "没有获得 Supabase 用户身份"
    );

    return false;

  }


  myId =
    data.user.id;


  return true;

}


/* =====================================================
   生成房间 ID
===================================================== */

function generateRoomId() {

  return crypto
    .randomUUID()
    .replaceAll(
      "-",
      ""
    )
    .substring(
      0,
      12
    );

}


/* =====================================================
   创建 Owner 房间
===================================================== */

async function createOwnerRoom() {

  roomId =
    generateRoomId();

  role =
    "owner";


  const avatar =
    localStorage.getItem(
      "click_my_avatar"
    ) ||
    defaultAvatar;


  const {
    data,
    error
  } =
    await supabase
      .from("rooms")
      .insert({

        id:
          roomId,

        owner_id:
          myId,

        guest_id:
          null,

        owner_avatar:
          avatar,

        guest_avatar:
          defaultAvatar,

        active:
          true

      })
      .select()
      .single();


  if (error) {

    console.error(
      "Create room error:",
      error
    );

    showToast(
      "创建房间失败：" +
      error.message
    );

    return false;

  }


  localStorage.setItem(
    "click_owner_room",
    roomId
  );


  const cleanUrl =
    window.location.origin +
    window.location.pathname;


  window.history.replaceState(
    {},
    "",
    cleanUrl
  );


  startRealtime();

  updateUI();

  updateAvatars(
    data
  );

  updateConnectionUI(
    data
  );


  return true;

}


/* =====================================================
   加入已有房间
===================================================== */

async function joinExistingRoom(
  id
) {

  roomId =
    id;


  const {
    data: room,
    error
  } =
    await supabase
      .from("rooms")
      .select("*")
      .eq(
        "id",
        roomId
      )
      .maybeSingle();


  if (error) {

    console.error(
      "Room lookup error:",
      error
    );

    showInvalidRoom(
      "无法读取这个 Click. 房间"
    );

    return false;

  }


  if (!room) {

    showInvalidRoom(
      "这个 Click. 房间不存在"
    );

    return false;

  }


  if (
    room.active !== true
  ) {

    showInvalidRoom(
      "这个 Click. 房间已经被主人断开"
    );

    return false;

  }


  /* Owner */

  if (
    room.owner_id === myId
  ) {

    role =
      "owner";

    startRealtime();

    updateAvatars(
      room
    );

    updateConnectionUI(
      room
    );

    updateUI();

    return true;

  }


  /* 已经是 Guest */

  if (
    room.guest_id === myId
  ) {

    role =
      "guest";

    startRealtime();

    updateAvatars(
      room
    );

    updateConnectionUI(
      room
    );

    updateUI();

    return true;

  }


  /* 房间没有 Guest */

  if (
    room.guest_id === null
  ) {

    const avatar =
      localStorage.getItem(
        "click_my_avatar"
      ) ||
      defaultAvatar;


    const {
      data: updatedRoom,
      error:
        updateError
    } =
    await supabase
      .from("rooms")
      .update({

        guest_id:
          myId,

        guest_avatar:
          avatar

      })
      .eq(
        "id",
        roomId
      )
      .is(
        "guest_id",
        null
      )
      .select()
      .single();


    if (updateError) {

      console.error(
        "Join room error:",
        updateError
      );

      showToast(
        "加入房间失败：" +
        updateError.message
      );

      return false;

    }


    role =
      "guest";


    startRealtime();

    updateAvatars(
      updatedRoom
    );

    updateConnectionUI(
      updatedRoom
    );

    updateUI();


    return true;

  }


  showInvalidRoom(
    "这个 Click. 房间已经有成员"
  );


  return false;

}


/* =====================================================
   实时连接
===================================================== */

function startRealtime() {

  if (
    realtimeChannel
  ) {

    supabase
      .removeChannel(
        realtimeChannel
      );

  }


  realtimeChannel =
    supabase
      .channel(
        `click-room-${roomId}`
      )


      /* ---------------------
         房间变化
      --------------------- */

      .on(

        "postgres_changes",

        {

          event: "*",

          schema: "public",

          table: "rooms",

          filter:
            `id=eq.${roomId}`

        },

        payload => {

          if (
            payload.eventType ===
            "DELETE"
          ) {

            showInvalidRoom(
              "这个 Click. 房间已经被删除"
            );

            return;

          }


          const room =
            payload.new;


          if (
            !room ||
            room.active !== true
          ) {

            showInvalidRoom(
              "主人已经断开了这个 Click."
            );

            return;

          }


          if (
            role === "guest" &&
            room.guest_id !== myId
          ) {

            showInvalidRoom(
              "你已经离开这个 Click. 房间"
            );

            return;

          }


          updateAvatars(
            room
          );

          updateConnectionUI(
            room
          );

        }

      )


      /* ---------------------
         消息变化
      --------------------- */

      .on(

        "postgres_changes",

        {

          event: "INSERT",

          schema: "public",

          table: "messages",

          filter:
            `room_id=eq.${roomId}`

        },

        payload => {

          const message =
            payload.new;


          if (
            !message
          ) return;


          /*
            自己发送的消息不弹。
            但是它已经被保存到 messages 表。
          */

          if (
            message.sender_id ===
            myId
          ) {

            return;

          }


          showMessage(

            message.title ||
            "对方",

            message.message

          );


          /*
            对方的新消息进入记录后，
            如果记录页面已经打开，则刷新。
          */

          loadMessageHistory();

        }

      )


      .subscribe(
        status => {

          console.log(
            "Realtime status:",
            status
          );

        }
      );

}


/* =====================================================

/* =====================================================
   消息记录
===================================================== */

async function loadMessageHistory() {

  if (
    !roomId ||
    !myId
  ) {

    historyList.innerHTML = `
      <div class="history-empty">
        暂无消息记录
      </div>
    `;

    return;

  }


  const {
    data,
    error
  } =
    await supabase
      .from("messages")
      .select("*")
      .eq(
        "room_id",
        roomId
      )
      .order(
        "created_at",
        {
          ascending: false
        }
      )
      .limit(100);


  if (error) {

    console.error(
      "Load message history error:",
      error
    );

    historyList.innerHTML = `
      <div class="history-empty">
        暂时无法读取消息记录
      </div>
    `;

    return;

  }


  if (
    !data ||
    data.length === 0
  ) {

    historyList.innerHTML = `
      <div class="history-empty">
        暂无消息记录
      </div>
    `;

    return;

  }


  historyList.innerHTML =
    "";


  data.forEach(
    message => {

      const item =
        document.createElement(
          "div"
        );


      item.className =
        "history-item";


      const isMine =
        message.sender_id ===
        myId;


      const senderName =
        isMine
          ? "你"
          : "对方";


      let timeText =
        "";


      if (
        message.created_at
      ) {

        const date =
          new Date(
            message.created_at
          );


        timeText =
          date.toLocaleString(
            "zh-CN",
            {
              month: "numeric",
              day: "numeric",
              hour: "2-digit",
              minute: "2-digit"
            }
          );

      }


      item.innerHTML = `

        <div class="history-top">

          <div class="history-name">
            ${senderName}
          </div>

          <div class="history-time">
            ${timeText}
          </div>

        </div>

        <div class="history-title-text">
          ${escapeHtml(
            message.title ||
            "状态"
          )}
        </div>

        <div class="history-message">
          ${escapeHtml(
            message.message ||
            ""
          )}
        </div>

      `;


      historyList.appendChild(
        item
      );

    }
  );

}


/* =====================================================
   HTML 转义
===================================================== */

function escapeHtml(
  text
) {

  const div =
    document.createElement(
      "div"
    );


  div.textContent =
    text == null
      ? ""
      : String(text);


  return div.innerHTML;

}


/* =====================================================
   清空当前房间消息记录
===================================================== */

document
  .getElementById(
    "clearHistoryBtn"
  )
  .onclick =
  async () => {

    if (
      !roomId
    ) {

      showToast(
        "当前没有房间"
      );

      return;

    }


    const confirmed =
      confirm(
        "确定清空这个房间的消息记录吗？"
      );


    if (!confirmed)
      return;


    const {
      error
    } =
      await supabase
        .from("messages")
        .delete()
        .eq(
          "room_id",
          roomId
        );


    if (error) {

      console.error(
        "Clear history error:",
        error
      );

      showToast(
        "清空失败：" +
        error.message
      );

      return;

    }


    loadMessageHistory();

    showToast(
      "消息记录已清空"
    );

  };


/* =====================================================
   发送消息
===================================================== */

async function sendMessage(
  title,
  message
) {

  if (
    !roomId ||
    !role ||
    !myId
  ) {

    showToast(
      "当前没有有效房间"
    );

    return;

  }


  const {
    data: room,
    error
  } =
    await supabase
      .from("rooms")
      .select("*")
      .eq(
        "id",
        roomId
      )
      .maybeSingle();


  if (
    error ||
    !room
  ) {

    showToast(
      "房间不存在"
    );

    return;

  }


  if (
    room.active !== true
  ) {

    showToast(
      "房间已经失效"
    );

    return;

  }


  if (
    role === "owner" &&
    !room.guest_id
  ) {

    showToast(
      "对方还没有加入"
    );

    return;

  }


  if (
    role === "guest" &&
    room.guest_id !== myId
  ) {

    showToast(
      "你已经退出这个房间"
    );

    return;

  }


  const {
    error:
      sendError
  } =
    await supabase
      .from("messages")
      .insert({

        room_id:
          roomId,

        sender_id:
          myId,

        sender_role:
          role,

        title:
          title,

        message:
          message

      });


  if (sendError) {

    console.error(
      "Send message error:",
      sendError
    );

    showToast(
      "消息发送失败：" +
      sendError.message
    );

    return;

  }


  /*
    自己发送的消息也会记录在数据库。
    立即刷新记录，方便自己查看。
  */

  loadMessageHistory();


  showToast(
    "已发送"
  );

}

/* =====================================================
   渲染按钮
===================================================== */

function renderButtons() {

  container.innerHTML =
    "";


  savedButtons.forEach(
    (btn, index) => {

      const el =
        document
          .createElement(
            "div"
          );


      el.className =
        "action-btn";


      el.innerHTML = `

        <span class="btn-icon">
          ${escapeHtml(btn.icon)}
        </span>

        <span class="btn-label">
          ${escapeHtml(btn.label)}
        </span>

      `;


      let pressTimer;


      el.addEventListener(
        "touchstart",
        () => {

          pressTimer =
            setTimeout(
              () => {

                if (
                  confirm(
                    `确定删除「${btn.label}」吗？`
                  )
                ) {

                  savedButtons.splice(
                    index,
                    1
                  );


                  localStorage.setItem(
                    "click_custom_buttons",
                    JSON.stringify(
                      savedButtons
                    )
                  );


                  renderButtons();

                }

              },
              800
            );

        }
      );


      el.addEventListener(
        "touchend",
        () => {

          clearTimeout(
            pressTimer
          );

        }
      );


      el.addEventListener(
        "click",
        () => {

          sendMessage(
            btn.label,
            btn.msg
          );

        }
      );


      container.appendChild(
        el
      );

    }
  );


  const add =
    document
      .createElement(
        "div"
      );


  add.className =
    "action-btn add-btn";


  add.innerHTML = `

    <span class="btn-icon">
      ＋
    </span>

    <span class="btn-label">
      添加状态
    </span>

  `;


  add.onclick =
    () => {

      addBtnModal
        .classList
        .add(
          "active"
        );

    };


  container.appendChild(
    add
  );

}

/* =====================================================

===================================================== */

shareBtn.onclick =

      !roomId

      return;

    }


    const shareUrl =
      window.location.origin +
      window.location.pathname +
      "?room=" +

        .clipboard
        .writeText(
          shareUrl
        );


      showToast(

    catch {

      prompt(

      );

/* =====================================================
   Owner 断开 / Guest 退出
===================================================== */

leaveBtn.onclick =
  async () => {

    if (
      !roomId
    ) return;


    /* =====================
       Owner 断开
    ===================== */

    if (
      role === "owner"
    ) {

      const {
        error
      } =
        await supabase
          .from("rooms")
          .update({

            active:
              false

          })
          .eq(
            "id",
            roomId
          )
          .eq(
            "owner_id",
            myId
          );


      if (error) {

        console.error(
          error
        );

        showToast(
          "断开失败：" +
          error.message
        );

        return;

      }


      if (
        realtimeChannel
      ) {

        await supabase
          .removeChannel(
            realtimeChannel
          );

        realtimeChannel =
          null;

      }


      window.location.href =
        window.location.origin +
        window.location.pathname;


      return;

    }


    /* =====================
       Guest 退出
    ===================== */

    if (
      role === "guest"
    ) {

      const {
        error
      } =
        await supabase
          .from("rooms")
          .update({

            guest_id:
              null,

            guest_avatar:
              defaultAvatar

          })
          .eq(
            "id",
            roomId
          )
          .eq(
            "guest_id",
            myId
          );


      if (error) {

        console.error(
          error
        );

        showToast(
          "退出失败：" +
          error.message
        );

        return;

      }


      if (
        realtimeChannel
      ) {

        await supabase
          .removeChannel(
            realtimeChannel
          );

        realtimeChannel =
          null;

      }


      window.location.href =
        window.location.origin +
        window.location.pathname;

    }

  };


/* =====================================================
   修改头像
===================================================== */

function chooseAvatar(
  avatarRole
) {

  const input =
    document
      .createElement(
        "input"
      );


  input.type =
    "file";


  input.accept =
    "image/png,image/jpeg,image/webp";


  input.onchange =
    event => {

      const file =
        event
          .target
          .files[0];


      if (!file)
        return;


      const reader =
        new FileReader();


      reader.onload =
        async e => {

          const image =
            e.target.result;


          localStorage.setItem(
            "click_my_avatar",
            image
          );


          let field;


          if (
            avatarRole ===
            "owner"
          ) {

            field =
              "owner_avatar";

          }

          else {

            field =
              "guest_avatar";

          }


          const {
            error
          } =
            await supabase
              .from("rooms")
              .update({

                [field]:
                  image

              })
              .eq(
                "id",
                roomId
              );


          if (error) {

            console.error(
              error
            );

            showToast(
              "头像更新失败：" +
              error.message
            );

            return;

          }


          showToast(
            "头像已更新"
          );

        };


      reader.readAsDataURL(
        file
      );

    };


  input.click();

}

   Owner 头像

document

   无效房间
===================================================== */

function showInvalidRoom(
  text
) {

  if (
    realtimeChannel
  ) {

    supabase
      .removeChannel(
        realtimeChannel
      );

    realtimeChannel =
      null;

  }


  document.body.innerHTML = `

    <div class="invalid-room">

      <div>

        <div style="
          font-size:48px;
          margin-bottom:20px;
        ">
          ∞
        </div>


        <h2>
          Click.
        </h2>


        <p style="
          color:#888;
          line-height:1.6;
        ">
          ${escapeHtml(text)}
        </p>


        <button
          id="backHomeBtn"
          style="
            margin-top:20px;
            border:none;
            background:#262626;
            color:#fff;
            padding:13px 24px;
            border-radius:8px;
            font-size:15px;
          "
        >
          创建新的 Click.
        </button>

      </div>

    </div>

  `;


  document
    .getElementById(
      "backHomeBtn"
    )
    .onclick =
    () => {

      window.location.href =
        window.location.origin +
        window.location.pathname;

    };

}


/* =====================================================
   初始化 Click.
===================================================== */

async function startClick() {

  const userReady =
    await initUser();


  if (!userReady) {

    return;

  }


  const params =
    new URLSearchParams(
      window.location.search
    );


  const invitedRoom =
    params.get(
      "room"
    );


  /*
    没有 room：
    创建 Owner 房间。
  */

  if (
    !invitedRoom
  ) {

    await createOwnerRoom();

  }


  /*
    有 room：
    加入已有房间。
  */

  else {

    await joinExistingRoom(
      invitedRoom
    );

  }


  renderButtons();

}


/* =====================================================
   启动
===================================================== */

startClick();

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Click.</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <style>
    :root {
      --bg-light: #fafafa;
      --text-main: #262626;
      --border-color: #dbdbdb;
      --accent: #0095f6;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-light);
      color: var(--text-main);
      margin: 0; padding: 0; min-height: 100vh;
      display: flex; flex-direction: column;
      user-select: none; /* 防止长按选中文本 */
    }

    header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 15px 20px; border-bottom: 1px solid var(--border-color); background: #fff;
    }
    .logo { font-size: 1.2rem; font-weight: 600; letter-spacing: 1px; }
    .profile-trigger {
      width: 36px; height: 36px; border-radius: 50%; overflow: hidden;
      cursor: pointer; border: 1px solid var(--border-color);
    }
    .profile-trigger img { width: 100%; height: 100%; object-fit: cover; }

    main { flex: 1; display: flex; justify-content: center; align-items: flex-start; padding: 30px 20px; }
    .button-container {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px;
      width: 100%; max-width: 350px;
    }
    .action-btn {
      background: #fff; border: 1px solid var(--border-color); border-radius: 12px;
      padding: 25px 15px; display: flex; flex-direction: column; align-items: center; gap: 12px;
      cursor: pointer; transition: all 0.2s ease; color: var(--text-main);
      -webkit-tap-highlight-color: transparent; position: relative;
    }
    .action-btn:active { background-color: #f0f0f0; transform: scale(0.97); }
    .btn-icon { font-size: 2rem; pointer-events: none; }
    .btn-label { font-size: 0.9rem; font-weight: 500; pointer-events: none; }
    
    /* 添加按钮样式 */
    .add-btn {
      background: transparent; border: 2px dashed var(--border-color);
      color: #999;
    }
    .add-btn:active { background: rgba(0,0,0,0.02); }

    /* 通用模态框样式 */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(8px);
      display: flex; justify-content: center; align-items: flex-end;
      opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
      z-index: 100;
    }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal-content {
      background: #fff; width: 100%; max-width: 450px;
      border-radius: 20px 20px 0 0; padding: 30px 20px; box-sizing: border-box;
      transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.1, 0.8, 0.2, 1);
    }
    .modal-overlay.active .modal-content { transform: translateY(0); }

    /* 个人中心羁绊区 */
    .connection-avatars { display: flex; justify-content: center; align-items: center; gap: 20px; margin-bottom: 30px; }
    .avatar-wrapper { width: 70px; height: 70px; border-radius: 50%; padding: 3px; background: linear-gradient(45deg, #d3cce3, #e9e4f0); cursor: pointer; position: relative; }
    .avatar-wrapper img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 2px solid #fff; box-sizing: border-box; }
    .avatar-wrapper::after { content: '+'; position: absolute; bottom: -5px; right: -5px; background: var(--text-main); color: #fff; width: 22px; height: 22px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 12px; font-weight: bold; border: 2px solid #fff; }
    .mobius { font-size: 2rem; color: #999; font-weight: 300; }
    
    .primary-btn {
      background: var(--text-main); color: #fff; border: none; padding: 14px 24px;
      border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; width: 100%;
    }

    /* 表单输入区 */
    .input-group { margin-bottom: 15px; }
    .input-group label { display: block; font-size: 0.85rem; color: #666; margin-bottom: 5px; }
    .input-group input { 
      width: 100%; padding: 12px; border: 1px solid var(--border-color); 
      border-radius: 8px; box-sizing: border-box; font-size: 1rem; 
    }
    .input-group input:focus { outline: none; border-color: var(--text-main); }
  </style>
</head>
<body>

  <header>
    <div class="logo">Sync.</div>
    <div class="profile-trigger" id="openProfileBtn">
      <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%23efefef' width='100' height='100'/></svg>" id="headerAvatar">
    </div>
  </header>

  <main>
    <div class="button-container" id="buttonContainer"></div>
  </main>

  <!-- 个人中心模态框 -->
  <div class="modal-overlay" id="profileModal">
    <div class="modal-content">
      <div class="connection-avatars">
        <div class="avatar-wrapper" id="myAvatarWrapper">
          <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%23efefef' width='100' height='100'/></svg>" id="myAvatar">
        </div>
        <div class="mobius">∞</div>
        <div class="avatar-wrapper" id="partnerAvatarWrapper">
          <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%23efefef' width='100' height='100'/></svg>" id="partnerAvatar">
        </div>
      </div>
      <div style="text-align: center;">
        <button class="primary-btn" id="shareBtn">🖇️ 获取专属连接</button>
      </div>
    </div>
  </div>

  <!-- 添加按钮模态框 -->
  <div class="modal-overlay" id="addBtnModal">
    <div class="modal-content">
      <h3 style="margin-top:0; margin-bottom: 20px;">新建状态按钮</h3>
      <div class="input-group">
        <label>Emoji 图标</label>
        <input type="text" id="newIcon" placeholder="例如: 🎮" maxlength="2">
      </div>
      <div class="input-group">
        <label>按钮名称</label>
        <input type="text" id="newLabel" placeholder="例如: 打游戏" maxlength="6">
      </div>
      <div class="input-group">
        <label>推送给对方的消息内容</label>
        <input type="text" id="newMsg" placeholder="例如: 对方正在大杀四方！">
      </div>
      <button class="primary-btn" id="saveNewBtn">保存</button>
    </div>
  </div>

  <script>
    // --- 1. 动态按钮数据管理 (LocalStorage) ---
    const defaultButtons = [
      { id: "eat", icon: "🍴", label: "吃饭", msg: "对方准备去吃饭了" },
      { id: "sleep", icon: "💤", label: "睡觉", msg: "对方困了，准备休息" }
    ];

    // 读取本地配置，如果没有就用默认的
    let savedButtons = JSON.parse(localStorage.getItem('sync_custom_buttons')) || defaultButtons;
    const container = document.getElementById('buttonContainer');

    function renderButtons() {
      container.innerHTML = ''; // 清空容器
      
      savedButtons.forEach((btn, index) => {
        const btnEl = document.createElement('div');
        btnEl.className = 'action-btn';
        btnEl.innerHTML = `<span class="btn-icon">${btn.icon}</span><span class="btn-label">${btn.label}</span>`;
        
        // 长按删除逻辑
        let pressTimer;
        btnEl.addEventListener('touchstart', () => {
          pressTimer = setTimeout(() => {
            if(confirm(`确定要删除 [${btn.label}] 按钮吗？`)) {
              savedButtons.splice(index, 1);
              localStorage.setItem('sync_custom_buttons', JSON.stringify(savedButtons));
              renderButtons();
            }
          }, 800); // 长按 0.8 秒触发
        });
        btnEl.addEventListener('touchend', () => clearTimeout(pressTimer));
        
        // 短按发送消息
        btnEl.addEventListener('click', () => {
          alert(`模拟推送: "${btn.msg}"`);
        });

        container.appendChild(btnEl);
      });

      // 添加 "+" 按钮
      const addBtn = document.createElement('div');
      addBtn.className = 'action-btn add-btn';
      addBtn.innerHTML = `<span class="btn-icon">＋</span><span class="btn-label">添加状态</span>`;
      addBtn.onclick = () => document.getElementById('addBtnModal').classList.add('active');
      container.appendChild(addBtn);
    }

    renderButtons(); // 初始渲染

    // --- 2. 保存新按钮逻辑 ---
    document.getElementById('saveNewBtn').onclick = () => {
      const icon = document.getElementById('newIcon').value || '✨';
      const label = document.getElementById('newLabel').value || '新状态';
      const msg = document.getElementById('newMsg').value || '发送了一个新状态';

      savedButtons.push({ id: Date.now().toString(), icon, label, msg });
      localStorage.setItem('sync_custom_buttons', JSON.stringify(savedButtons));
      
      renderButtons();
      
      // 清空输入框并关闭模态框
      document.getElementById('newIcon').value = '';
      document.getElementById('newLabel').value = '';
      document.getElementById('newMsg').value = '';
      document.getElementById('addBtnModal').classList.remove('active');
    };

    // --- 3. 模态框通用关闭逻辑 ---
    document.querySelectorAll('.modal-overlay').forEach(modal => {
      modal.addEventListener('click', (e) => {
        if (e.target === modal) modal.classList.remove('active');
      });
    });
    document.getElementById('openProfileBtn').onclick = () => document.getElementById('profileModal').classList.add('active');

    // --- 4. 头像与链接逻辑 (保持不变) ---
    function setupAvatar(wrapperId, imgIds, storageKey) {
      const wrapper = document.getElementById(wrapperId);
      const savedImage = localStorage.getItem(storageKey);
      if (savedImage) imgIds.forEach(id => document.getElementById(id).src = savedImage);

      wrapper.onclick = () => {
        const input = document.createElement('input'); input.type = 'file'; input.accept = 'image/png, image/jpeg';
        input.onchange = (e) => {
          const file = e.target.files[0];
          if (file) {
            const reader = new FileReader();
            reader.onload = (event) => {
              const b64 = event.target.result;
              imgIds.forEach(id => document.getElementById(id).src = b64);
              localStorage.setItem(storageKey, b64);
            };
            reader.readAsDataURL(file);
          }
        };
        input.click();
      };
    }
    setupAvatar('myAvatarWrapper', ['myAvatar', 'headerAvatar'], 'my_avatar_data');
    setupAvatar('partnerAvatarWrapper', ['partnerAvatar'], 'partner_avatar_data');

    document.getElementById('shareBtn').onclick = () => {
      let roomId = localStorage.getItem('sync_room_id');
      if (!roomId) {
        roomId = Math.random().toString(36).substring(2, 15);
        localStorage.setItem('sync_room_id', roomId);
      }
      const shareUrl = `${window.location.origin}${window.location.pathname}?room=${roomId}`;
      navigator.clipboard.writeText(shareUrl).then(() => alert("🔗 专属链接已复制！\n\n" + shareUrl))
      .catch(() => alert("复制失败，请手动复制: " + shareUrl));
    };
  </script>
</body>
</html>
